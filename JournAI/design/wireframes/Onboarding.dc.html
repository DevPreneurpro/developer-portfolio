<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
    :root{
      --bg:#FBF6F0; --card:#FFFFFF; --ink:#2B241F; --ink-soft:#83766A; --ink-faint:#B3A99C;
      --accent:#C1673E; --accent-dark:#9C5230; --accent-tint:#F3DFCF; --border:#EAE0D2;
      --serif:'Source Serif 4', Georgia, 'Iowan Old Style', serif;
      --sans:-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin:0; }
    a { color: var(--accent-dark); }
    a:hover { color: var(--accent); }
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);border-radius:28px;overflow:hidden;position:relative;font-family:var(--sans);box-shadow:0 1px 3px rgba(43,36,31,0.08);">

  <div style="position:absolute;top:-90px;left:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle, rgba(193,103,62,0.16) 0%, rgba(193,103,62,0) 70%);"></div>

  <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:88px 24px 40px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:64px;">
      <div style="width:68px;height:68px;border-radius:50%;background:var(--accent-tint);display:flex;align-items:center;justify-content:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9C5230" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6c-1.6-1.4-4-2-6.5-2C4.7 4 4 4.6 4 5.4v12.2c0 .8.7 1.3 1.5 1.2 2.2-.3 4.4.2 6 1.5"/>
          <path d="M12 6c1.6-1.4 4-2 6.5-2 .8 0 1.5.6 1.5 1.4v12.2c0 .8-.7 1.3-1.5 1.2-2.2-.3-4.4.2-6 1.5"/>
          <path d="M12 6v14"/>
        </svg>
      </div>
      <div style="text-align:center;">
        <div style="font-family:var(--serif);font-size:34px;color:var(--ink);letter-spacing:-0.01em;">
          journ<span style="color:var(--accent-dark);font-weight:600;">AI</span>
        </div>
        <div style="font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-soft);margin-top:10px;">
          Your thoughts, held gently.
        </div>
      </div>
    </div>

    <div style="flex:1;"></div>

    <div style="display:flex;flex-direction:column;gap:12px;width:100%;">
      <button style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:27px;background:#161311;color:#FBF6F0;border:none;font-family:var(--sans);font-size:17px;font-weight:500;">
        <svg width="17" height="20" viewBox="0 0 17 20" fill="#FBF6F0"><path d="M13.9 10.6c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.3-.1-2.6.8-3.2.8-.7 0-1.7-.8-2.9-.8-1.5 0-2.9.9-3.6 2.2-1.6 2.7-.4 6.7 1.1 8.9.7 1.1 1.6 2.3 2.8 2.3 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7c1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6-.1 0-2.6-1-2.6-3.5zM11.6 3.9c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2z"/></svg>
        Continue with Apple
      </button>
      <button style="width:100%;height:54px;border-radius:27px;background:transparent;color:var(--ink);border:1.5px solid var(--ink-faint);font-family:var(--sans);font-size:17px;font-weight:500;">
        Continue with Email
      </button>
      <div style="text-align:center;margin-top:6px;">
        <span style="font-family:var(--sans);font-size:14px;color:var(--ink-soft);">Already journaling with us? </span><a href="#" style="font-family:var(--sans);font-size:14px;font-weight:600;text-decoration:none;">Sign in</a>
      </div>
      <div style="text-align:center;font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin-top:14px;line-height:1.5;">
        By continuing you agree to our <a href="#" style="color:var(--ink-faint);text-decoration:underline;">Terms</a> &amp; <a href="#" style="color:var(--ink-faint);text-decoration:underline;">Privacy Policy</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
