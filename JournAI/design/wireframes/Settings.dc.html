<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
    :root{
      --bg:#FBF6F0; --card:#FFFFFF; --ink:#2B241F; --ink-soft:#83766A; --ink-faint:#B3A99C;
      --accent:#C1673E; --accent-dark:#9C5230; --accent-tint:#F3DFCF; --border:#EAE0D2; --danger:#B3453A;
      --serif:'Source Serif 4', Georgia, 'Iowan Old Style', serif;
      --sans:-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin:0; }
    .row { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; }
    .row + .row { border-top:1px solid var(--border); }
    .label { font-size:15px; color:var(--ink); }
    .value { font-size:14px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
    .section-title { font-size:12px; letter-spacing:0.08em; color:var(--ink-soft); font-weight:700; margin:0 0 8px 4px; }
    .group { background:var(--card); border:1px solid var(--border); border-radius:18px; overflow:hidden; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);border-radius:28px;overflow:hidden;position:relative;font-family:var(--sans);box-shadow:0 1px 3px rgba(43,36,31,0.08);">

  <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 18px 110px;display:flex;flex-direction:column;gap:22px;">

    <div style="font-family:var(--serif);font-size:28px;color:var(--ink);padding-left:4px;">Settings</div>

    <div class="group" style="padding:14px 16px;display:flex;align-items:center;gap:14px;">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--accent-tint);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;color:var(--accent-dark);flex-shrink:0;">A</div>
      <div style="flex:1;">
        <div style="font-size:16px;font-weight:600;color:var(--ink);">Alex Rivera</div>
        <div style="font-size:13px;color:var(--ink-soft);">alex.rivera@icloud.com</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3A99C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <div>
      <div class="section-title">AI COMPANION</div>
      <div class="group">
        <div class="row">
          <span class="label">Companion Name</span>
          <span class="value">Sage <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3A99C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </div>
        <div class="row">
          <span class="label">Personality</span>
          <span class="value">Calm &amp; Curious <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3A99C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </div>
        <div class="row">
          <span class="label">Voice Replies</span>
          <div style="width:44px;height:26px;border-radius:13px;background:var(--accent-dark);position:relative;">
            <div style="position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:#FBF6F0;"></div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">REMINDERS</div>
      <div class="group">
        <div class="row">
          <span class="label">Daily Check-in</span>
          <div style="width:44px;height:26px;border-radius:13px;background:var(--accent-dark);position:relative;">
            <div style="position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:#FBF6F0;"></div>
          </div>
        </div>
        <div class="row">
          <span class="label">Reminder Time</span>
          <span class="value">9:00 PM <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3A99C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">PRIVACY &amp; DATA</div>
      <div class="group">
        <div class="row">
          <span class="label">Face ID Lock</span>
          <div style="width:44px;height:26px;border-radius:13px;background:var(--accent-dark);position:relative;">
            <div style="position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:#FBF6F0;"></div>
          </div>
        </div>
        <div class="row">
          <span class="label">Export My Journal</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3A99C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="row">
          <span class="label" style="color:var(--danger);">Delete All Entries</span>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">ABOUT</div>
      <div class="group">
        <div class="row">
          <span class="label">Version</span>
          <span class="value">1.0.0</span>
        </div>
        <div class="row">
          <span class="label">Terms &amp; Privacy</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3A99C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>

    <div style="text-align:center;font-size:15px;font-weight:600;color:var(--danger);padding:10px 0;">Sign Out</div>
  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;height:88px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 44px 20px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3A99C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg>
      <span style="font-size:11px;font-weight:600;color:var(--ink-faint);">Home</span>
    </div>
    <div style="width:1px;"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9C5230" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4H6a1 1 0 0 0-1 1v15l4-2.5L13 20l4-2.5V6.5"/><path d="M13 4v9l2-1.3 2 1.3V4"/></svg>
      <span style="font-size:11px;font-weight:600;color:var(--accent-dark);">Settings</span>
    </div>
  </div>

  <div style="position:absolute;bottom:52px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:var(--accent-dark);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(156,82,48,0.4);">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FBF6F0" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>
</div>
</x-dc>
</body>
</html>
